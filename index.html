<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Mercado por Voz</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --excel: #1d6f42;
      --excel-dark: #145331;
      --danger: #ef4444;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Botão de Voz */
    .voice-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: #ecfdf5;
      border: 1px dashed var(--primary);
      border-radius: 12px;
    }

    .btn-mic {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s, background 0.2s;
    }

    .btn-mic:hover {
      background: var(--primary-dark);
    }

    .btn-mic.listening {
      background: var(--danger);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    #statusText {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      min-height: 20px;
    }

    /* Formulário Manual (Ordem: Qtd -> Produto -> Valor) */
    .manual-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .manual-form input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .manual-form input:focus {
      border-color: var(--primary);
    }

    #inputQtd {
      flex: 0 1 70px;
      text-align: center;
    }

    #inputNome {
      flex: 2 1 160px;
    }

    #inputValor {
      flex: 1 1 100px;
    }

    .btn-add {
      background: var(--text);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Lista de Itens */
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f9fafb;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      gap: 10px;
    }

    .item.checked .item-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-name {
      font-weight: 600;
    }

    .item-detail {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e5e7eb;
      border-radius: 6px;
      padding: 2px 6px;
    }

    .btn-qty {
      background: none;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 0.95rem;
      color: var(--text);
    }

    .item-subtotal {
      font-weight: 700;
      color: var(--primary-dark);
      min-width: 75px;
      text-align: right;
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    /* Rodapé / Total / Ações */
    footer {
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .total-box span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .total-box strong {
      font-size: 1.4rem;
      color: var(--text);
    }

    .footer-actions {
      display: flex;
      gap: 8px;
    }

    .btn-export {
      background: var(--excel);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-export:hover {
      background: var(--excel-dark);
    }

    .btn-clear {
      background: transparent;
      border: 1px solid #d1d5db;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-clear:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 Lista de Mercado</h1>
      <p>Fale: <strong>"2 arroz 25 reais"</strong> ou apenas <strong>"Arroz 25 reais"</strong> (qtd = 1)</p>
    </header>

    <div class="voice-section">
      <button id="btnMic" class="btn-mic" type="button">🎤 Falar Qtd, Produto e Valor</button>
      <div id="statusText">Pronto para ouvir...</div>
    </div>

    <!-- Ordem: Quantidade -> Produto -> Valor -->
    <form id="manualForm" class="manual-form">
      <input type="number" id="inputQtd" placeholder="Qtd" value="1" min="1" step="1" required title="Quantidade" />
      <input type="text" id="inputNome" placeholder="Produto (ex: Arroz)" required />
      <input type="number" id="inputValor" placeholder="Valor (R$)" step="0.01" min="0" required />
      <button type="submit" class="btn-add">+</button>
    </form>

    <ul id="listaItens"></ul>

    <footer>
      <div class="total-box">
        <span>Total da Lista</span>
        <strong id="valorTotal">R$ 0,00</strong>
      </div>
      <div class="footer-actions">
        <button id="btnExportar" class="btn-export" type="button">📊 Exportar Excel/CSV</button>
        <button id="btnLimpar" class="btn-clear" type="button">Limpar</button>
      </div>
    </footer>
  </div>

  <script>
    const btnMic = document.getElementById('btnMic');
    const statusText = document.getElementById('statusText');
    const manualForm = document.getElementById('manualForm');
    const inputQtd = document.getElementById('inputQtd');
    const inputNome = document.getElementById('inputNome');
    const inputValor = document.getElementById('inputValor');
    const listaItens = document.getElementById('listaItens');
    const valorTotal = document.getElementById('valorTotal');
    const btnLimpar = document.getElementById('btnLimpar');
    const btnExportar = document.getElementById('btnExportar');

    let itens = JSON.parse(localStorage.getItem('listaMercado')) || [];

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function salvarERenderizar() {
      localStorage.setItem('listaMercado', JSON.stringify(itens));
      listaItens.innerHTML = '';
      let totalGeral = 0;

      itens.forEach((item, index) => {
        const qtd = item.quantidade || 1;
        const subtotal = item.valor * qtd;
        totalGeral += subtotal;

        const li = document.createElement('li');
        li.className = `item ${item.comprado ? 'checked' : ''}`;
        li.innerHTML = `
          <div class="item-left">
            <input type="checkbox" ${item.comprado ? 'checked' : ''} onchange="alternarItem(${index})" />
            <div class="item-info">
              <span class="item-name">${item.nome}</span>
              <span class="item-detail">${qtd}x ${formatarMoeda(item.valor)}</span>
            </div>
          </div>
          <div class="item-right">
            <div class="qty-controls">
              <button class="btn-qty" onclick="alterarQuantidade(${index}, -1)" title="Diminuir">-</button>
              <span>${qtd}</span>
              <button class="btn-qty" onclick="alterarQuantidade(${index}, 1)" title="Aumentar">+</button>
            </div>
            <span class="item-subtotal">${formatarMoeda(subtotal)}</span>
            <button class="btn-del" onclick="removerItem(${index})" title="Remover">✕</button>
          </div>
        `;
        listaItens.appendChild(li);
      });

      valorTotal.textContent = formatarMoeda(totalGeral);
    }

    function adicionarItem(quantidade, nome, valor) {
      const qtdFinal = parseInt(quantidade, 10) || 1;
      const nomeLimpo = nome.trim();
      const nomeFormatado = nomeLimpo.charAt(0).toUpperCase() + nomeLimpo.slice(1);

      itens.push({
        quantidade: qtdFinal,
        nome: nomeFormatado,
        valor: parseFloat(valor) || 0,
        comprado: false
      });
      salvarERenderizar();
    }

    window.alterarQuantidade = (index, delta) => {
      const novaQtd = (itens[index].quantidade || 1) + delta;
      if (novaQtd >= 1) {
        itens[index].quantidade = novaQtd;
        salvarERenderizar();
      }
    };

    window.alternarItem = (index) => {
      itens[index].comprado = !itens[index].comprado;
      salvarERenderizar();
    };

    window.removerItem = (index) => {
      itens.splice(index, 1);
      salvarERenderizar();
    };

    btnLimpar.addEventListener('click', () => {
      if (itens.length && confirm('Deseja apagar toda a lista?')) {
        itens = [];
        salvarERenderizar();
      }
    });

    // Exportar para CSV compatível com Excel PT-BR
    btnExportar.addEventListener('click', () => {
      if (!itens.length) {
        alert('A lista está vazia! Adicione itens antes de exportar.');
        return;
      }

      const linhas = [
        ['Quantidade', 'Produto', 'Valor Unitário (R$)', 'Subtotal (R$)', 'Status']
      ];

      let totalGeral = 0;

      itens.forEach((item) => {
        const qtd = item.quantidade || 1;
        const unitario = item.valor || 0;
        const subtotal = qtd * unitario;
        totalGeral += subtotal;

        linhas.push([
          qtd,
          `"${item.nome.replace(/"/g, '""')}"`,
          unitario.toFixed(2).replace('.', ','),
          subtotal.toFixed(2).replace('.', ','),
          item.comprado ? 'Comprado' : 'Pendente'
        ]);
      });

      // Linha final com o Total Geral
      linhas.push(['', '', 'TOTAL GERAL', totalGeral.toFixed(2).replace('.', ','), '']);

      // BOM UTF-8 (\uFEFF) garante que acentos abram corretamente no Excel
      const csvConteudo = '\uFEFF' + linhas.map(linha => linha.join(';')).join('\r\n');
      const blob = new Blob([csvConteudo], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const dataHoje = new Date().toISOString().slice(0, 10);
      const link = document.createElement('a');
      link.href = url;
      link.download = `lista_mercado_${dataHoje}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    manualForm.addEventListener('submit', (e) => {
      e.preventDefault();
      adicionarItem(inputQtd.value, inputNome.value, inputValor.value);
      inputQtd.value = '1';
      inputNome.value = '';
      inputValor.value = '';
      inputQtd.focus();
    });

    function converterNumerosExtensoInicio(texto) {
      const mapa = {
        'um': '1', 'uma': '1', 'dois': '2', 'duas': '2',
        'três': '3', 'tres': '3', 'quatro': '4', 'cinco': '5',
        'seis': '6', 'sete': '7', 'oito': '8', 'nove': '9', 'dez': '10'
      };
      return texto.replace(/^(um|uma|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove|dez)\b/i, (m) => mapa[m.toLowerCase()]);
    }

    function interpretarFala(texto) {
      let limpo = converterNumerosExtensoInicio(texto.toLowerCase().trim());
      let quantidade = 1;

      const matchQtdInicio = limpo.match(/^(\d+)\s+(?:unidades?\s+de\s+|pacotes?\s+de\s+|caixas?\s+de\s+|latas?\s+de\s+|garrafas?\s+de\s+)?(.+)$/);
      if (matchQtdInicio) {
        quantidade = parseInt(matchQtdInicio[1], 10);
        limpo = matchQtdInicio[2].trim();
      }

      limpo = limpo
        .replace(/\s+reais\s+e\s+/g, '.')
        .replace(/\s+real\s+e\s+/g, '.')
        .replace(/\s+reais?/g, '')
        .replace(/\s+centavos?/g, '')
        .replace(/r\$\s*/g, '')
        .replace(/(\d+)\s+e\s+(\d{1,2})\b/g, '$1.$2')
        .replace(/(\d+),(\d{1,2})/g, '$1.$2');

      const matchPreco = limpo.match(/^(.*?)\s*(\d+(?:\.\d{1,2})?)$/);

      if (matchPreco && matchPreco[1].trim()) {
        const produto = matchPreco[1].replace(/\b(por|custa|valor|de|cada|a)\s*$/g, '').trim();
        const preco = parseFloat(matchPreco[2]);
        const subtotal = preco * quantidade;

        adicionarItem(quantidade, produto, preco);
        statusText.textContent = `✅ ${quantidade}x ${produto} (${formatarMoeda(preco)} un.) = ${formatarMoeda(subtotal)}`;
      } else {
        adicionarItem(quantidade, limpo || texto.trim(), 0);
        statusText.textContent = `⚠️ Adicionado sem valor: ${quantidade}x "${limpo || texto}"`;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      btnMic.addEventListener('click', () => {
        recognition.start();
      });

      recognition.onstart = () => {
        btnMic.classList.add('listening');
        btnMic.textContent = '🛑 Ouvindo... Fale agora';
        statusText.textContent = 'Ex: "2 arroz 25 reais" ou "Feijão 8 e 50"';
      };

      recognition.onresult = (event) => {
        const transcricao = event.results[0][0].transcript;
        interpretarFala(transcricao);
      };

      recognition.onerror = (event) => {
        statusText.textContent = `Erro no microfone: ${event.error}`;
      };

      recognition.onend = () => {
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤 Falar Qtd, Produto e Valor';
      };
    } else {
      btnMic.disabled = true;
      statusText.textContent = 'Seu navegador não suporta comando de voz. Use o campo manual.';
    }

    salvarERenderizar();
  </script>
</body>
</html>
