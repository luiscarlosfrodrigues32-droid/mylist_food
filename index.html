<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Mercado com Firebase</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --excel: #1d6f42;
      --excel-dark: #145331;
      --danger: #ef4444;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Tela de Autenticação */
    #authScreen {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    #authScreen h1 {
      font-size: 1.6rem;
      color: var(--primary-dark);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form input {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .auth-form input:focus {
      border-color: var(--primary);
    }

    .btn-auth {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-auth:hover {
      background: var(--primary-dark);
    }

    .auth-toggle {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
    }

    #authError {
      color: var(--danger);
      font-size: 0.85rem;
      min-height: 18px;
    }

    /* App Principal (Oculto até logar) */
    #mainApp {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .app-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: -10px;
    }

    #userEmailDisplay {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn-logout {
      background: none;
      border: 1px solid #d1d5db;
      color: var(--danger);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Botão de Voz */
    .voice-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: #ecfdf5;
      border: 1px dashed var(--primary);
      border-radius: 12px;
    }

    .btn-mic {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s, background 0.2s;
    }

    .btn-mic:hover {
      background: var(--primary-dark);
    }

    .btn-mic.listening {
      background: var(--danger);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    #statusText {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      min-height: 20px;
    }

    /* Formulário Manual (Qtd -> Produto -> Valor) */
    .manual-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .manual-form input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .manual-form input:focus {
      border-color: var(--primary);
    }

    #inputQtd {
      flex: 0 1 70px;
      text-align: center;
    }

    #inputNome {
      flex: 2 1 160px;
    }

    #inputValor {
      flex: 1 1 100px;
    }

    .btn-add {
      background: var(--text);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Lista de Itens */
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f9fafb;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      gap: 10px;
    }

    .item.checked .item-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-name {
      font-weight: 600;
    }

    .item-detail {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e5e7eb;
      border-radius: 6px;
      padding: 2px 6px;
    }

    .btn-qty {
      background: none;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 0.95rem;
      color: var(--text);
    }

    .item-subtotal {
      font-weight: 700;
      color: var(--primary-dark);
      min-width: 75px;
      text-align: right;
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    /* Rodapé / Total */
    footer {
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .total-box span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .total-box strong {
      font-size: 1.4rem;
      color: var(--text);
    }

    .footer-actions {
      display: flex;
      gap: 8px;
    }

    .btn-export {
      background: var(--excel);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid #d1d5db;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="authScreen">
      <h1>🛒 Lista de Mercado</h1>
      <p id="authSubtitle">Entre na sua conta para acessar sua lista na nuvem</p>

      <form id="authForm" class="auth-form">
        <input type="email" id="authEmail" placeholder="Seu e-mail" required />
        <input type="password" id="authPassword" placeholder="Sua senha (mínimo 6 dígitos)" required />
        <button type="submit" id="authSubmitBtn" class="btn-auth">Entrar</button>
      </form>

      <div id="authError"></div>

      <button type="button" id="authToggleBtn" class="auth-toggle">Não tem conta? Cadastre-se</button>
    </div>

    <!-- APLICATIVO PRINCIPAL (Protegido por Login) -->
    <div id="mainApp">
      <div class="app-header-top">
        <span id="userEmailDisplay"></span>
        <button id="btnLogout" class="btn-logout" type="button">Sair</button>
      </div>

      <header>
        <h1>🛒 Minha Lista</h1>
        <p>Fale apenas produto e valor: <strong>"Arroz 25 reais"</strong> ou <strong>"Café 18 e 90"</strong></p>
      </header>

      <div class="voice-section">
        <button id="btnMic" class="btn-mic" type="button">🎤 Falar Produto e Valor</button>
        <div id="statusText">Pronto para ouvir...</div>
      </div>

      <form id="manualForm" class="manual-form">
        <input type="number" id="inputQtd" placeholder="Qtd" value="1" min="1" step="1" required title="Quantidade" />
        <input type="text" id="inputNome" placeholder="Produto (ex: Arroz)" required />
        <input type="number" id="inputValor" placeholder="Valor (R$)" step="0.01" min="0" required />
        <button type="submit" class="btn-add">+</button>
      </form>

      <ul id="listaItens"></ul>

      <footer>
        <div class="total-box">
          <span>Total da Lista</span>
          <strong id="valorTotal">R$ 0,00</strong>
        </div>
        <div class="footer-actions">
          <button id="btnExportar" class="btn-export" type="button">📊 Excel</button>
          <button id="btnLimpar" class="btn-clear" type="button">Limpar</button>
        </div>
      </footer>
    </div>
  </div>

  <!-- Importando o Firebase v10 via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      deleteDoc,
      query,
      where,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==========================================
    // ⚙️ CONFIGURAÇÃO DO SEU FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyC9IW8dctpLeWQYvfDY82eiyEe1xjsP5Pw",
  authDomain: "mylist-food.firebaseapp.com",
  projectId: "mylist-food",
  storageBucket: "mylist-food.firebasestorage.app",
  messagingSenderId: "89873159830",
  appId: "1:89873159830:web:0e9957ca152001917014b7",
  measurementId: "G-TK0MRFRSFK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioAtual = null;
    let itensCache = [];
    let unsubscribeSnapshot = null;

    // Elementos da UI de Autenticação
    const authScreen = document.getElementById('authScreen');
    const mainApp = document.getElementById('mainApp');
    const authForm = document.getElementById('authForm');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authToggleBtn = document.getElementById('authToggleBtn');
    const authError = document.getElementById('authError');
    const authSubtitle = document.getElementById('authSubtitle');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const btnLogout = document.getElementById('btnLogout');

    let modoCadastro = false;

    authToggleBtn.addEventListener('click', () => {
      modoCadastro = !modoCadastro;
      if (modoCadastro) {
        authSubtitle.textContent = "Crie sua nova conta na nuvem";
        authSubmitBtn.textContent = "Cadastrar";
        authToggleBtn.textContent = "Já tem conta? Faça login";
      } else {
        authSubtitle.textContent = "Entre na sua conta para acessar sua lista";
        authSubmitBtn.textContent = "Entrar";
        authToggleBtn.textContent = "Não tem conta? Cadastre-se";
      }
      authError.textContent = "";
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = "";
      const email = authEmail.value;
      const senha = authPassword.value;

      try {
        if (modoCadastro) {
          await createUserWithEmailAndPassword(auth, email, senha);
        } else {
          await signInWithEmailAndPassword(auth, email, senha);
        }
      } catch (error) {
        if (error.code === 'auth/invalid-credential') {
          authError.textContent = "E-mail ou senha inválidos.";
        } else if (error.code === 'auth/email-already-in-use') {
          authError.textContent = "Este e-mail já está cadastrado.";
        } else if (error.code === 'auth/weak-password') {
          authError.textContent = "A senha deve ter pelo menos 6 caracteres.";
        } else {
          authError.textContent = "Erro: " + error.message;
        }
      }
    });

    btnLogout.addEventListener('click', () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        usuarioAtual = user;
        authScreen.style.display = 'none';
        mainApp.style.display = 'flex';
        userEmailDisplay.textContent = user.email;
        carregarItensTempoReal(user.uid);
      } else {
        usuarioAtual = null;
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        mainApp.style.display = 'none';
        authScreen.style.display = 'flex';
        authEmail.value = '';
        authPassword.value = '';
      }
    });

    // ==========================================
    // 📦 GERENCIAMENTO DA LISTA NO FIRESTORE
    // ==========================================
    const listaItens = document.getElementById('listaItens');
    const valorTotal = document.getElementById('valorTotal');
    const manualForm = document.getElementById('manualForm');
    const inputQtd = document.getElementById('inputQtd');
    const inputNome = document.getElementById('inputNome');
    const inputValor = document.getElementById('inputValor');
    const btnLimpar = document.getElementById('btnLimpar');
    const btnExportar = document.getElementById('btnExportar');
    const btnMic = document.getElementById('btnMic');
    const statusText = document.getElementById('statusText');

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderizarLista(itens) {
      listaItens.innerHTML = '';
      let totalGeral = 0;

      itens.forEach((item) => {
        const qtd = item.quantidade || 1;
        const subtotal = item.valor * qtd;
        totalGeral += subtotal;

        const li = document.createElement('li');
        li.className = `item ${item.comprado ? 'checked' : ''}`;
        li.innerHTML = `
          <div class="item-left">
            <input type="checkbox" ${item.comprado ? 'checked' : ''} onchange="window.alternarItem('${item.id}', ${!item.comprado})" />
            <div class="item-info">
              <span class="item-name">${item.nome}</span>
              <span class="item-detail">${qtd}x ${formatarMoeda(item.valor)}</span>
            </div>
          </div>
          <div class="item-right">
            <div class="qty-controls">
              <button class="btn-qty" onclick="window.alterarQuantidade('${item.id}', ${qtd}, -1)">-</button>
              <span>${qtd}</span>
              <button class="btn-qty" onclick="window.alterarQuantidade('${item.id}', ${qtd}, 1)">+</button>
            </div>
            <span class="item-subtotal">${formatarMoeda(subtotal)}</span>
            <button class="btn-del" onclick="window.removerItem('${item.id}')">✕</button>
          </div>
        `;
        listaItens.appendChild(li);
      });

      valorTotal.textContent = formatarMoeda(totalGeral);
    }

    function carregarItensTempoReal(uid) {
      const q = query(collection(db, "mercado"), where("userId", "==", uid));
      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        itensCache = [];
        snapshot.forEach((docSnap) => {
          itensCache.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderizarLista(itensCache);
      });
    }

    async function adicionarItemFirestore(quantidade, nome, valor) {
      if (!usuarioAtual) return;
      const qtdFinal = parseInt(quantidade, 10) || 1;
      const nomeLimpo = nome.trim();
      const nomeFormatado = nomeLimpo.charAt(0).toUpperCase() + nomeLimpo.slice(1);

      await addDoc(collection(db, "mercado"), {
        userId: usuarioAtual.uid,
        quantidade: qtdFinal,
        nome: nomeFormatado,
        valor: parseFloat(valor) || 0,
        comprado: false,
        criadoEm: Date.now()
      });
    }

    window.alterarQuantidade = async (id, qtdAtual, delta) => {
      const novaQtd = qtdAtual + delta;
      if (novaQtd >= 1) {
        const docRef = doc(db, "mercado", id);
        await updateDoc(docRef, { quantidade: novaQtd });
      }
    };

    window.alternarItem = async (id, novoStatus) => {
      const docRef = doc(db, "mercado", id);
      await updateDoc(docRef, { comprado: novoStatus });
    };

    window.removerItem = async (id) => {
      await deleteDoc(doc(db, "mercado", id));
    };

    btnLimpar.addEventListener('click', async () => {
      if (itensCache.length && confirm('Deseja apagar todos os itens da sua lista?')) {
        for (let item of itensCache) {
          await deleteDoc(doc(db, "mercado", item.id));
        }
      }
    });

    manualForm.addEventListener('submit', (e) => {
      e.preventDefault();
      adicionarItemFirestore(inputQtd.value, inputNome.value, inputValor.value);
      inputQtd.value = '1';
      inputNome.value = '';
      inputValor.value = '';
      inputNome.focus();
    });

    // ==========================================
    // ==========================================
    // 🎤 RECONHECIMENTO DE VOZ (Corrigido para centavos)
    // ==========================================
    function interpretarFala(texto) {
      const original = texto.trim();
      let limpo = original.toLowerCase();
      const quantidadePadrao = 1;

      // Remove palavras de ligação/moeda que atrapalham o padrão
      limpo = limpo
        .replace(/r\$\s*/g, '')
        .replace(/\b(reais|real|centavos|centavo)\b/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      let produto = '';
      let preco = 0;
      let encontrouPreco = false;

      // 1º: Tenta capturar preço composto no final: "23 e 10", "23,10" ou "23.10"
      const matchComposto = limpo.match(/^(.*?)\s+(\d+)\s*(?:e|,|\.)\s*(\d{1,2})$/);

      if (matchComposto && matchComposto[1].trim()) {
        produto = matchComposto[1];
        const reais = matchComposto[2];
        // Se falar "23 e 5", assume 50 centavos; se falar "23 e 05" ou "23 e 10", mantém os 2 dígitos
        const centavos = matchComposto[3].padEnd(2, '0');
        preco = parseFloat(`${reais}.${centavos}`);
        encontrouPreco = true;
      } else {
        // 2º: Tenta capturar preço inteiro no final: "café 23"
        const matchInteiro = limpo.match(/^(.*?)\s+(\d+)$/);
        if (matchInteiro && matchInteiro[1].trim()) {
          produto = matchInteiro[1];
          preco = parseFloat(matchInteiro[2]);
          encontrouPreco = true;
        }
      }

      if (encontrouPreco) {
        // Limpa preposições sobrando no final do nome do produto (ex: "café por", "arroz de")
        produto = produto.replace(/\b(por|custa|valor|de|cada|a)\s*$/g, '').trim();

        adicionarItemFirestore(quantidadePadrao, produto, preco);
        statusText.textContent = `✅ 1x ${produto} (${formatarMoeda(preco)})`;
      } else {
        adicionarItemFirestore(quantidadePadrao, original, 0);
        statusText.textContent = `⚠️ Adicionado sem valor: 1x "${original}"`;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      btnMic.addEventListener('click', () => {
        recognition.start();
      });

      recognition.onstart = () => {
        btnMic.classList.add('listening');
        btnMic.textContent = '🛑 Ouvindo... Fale agora';
        statusText.textContent = 'Ex: "Arroz 25 reais" ou "Leite 5 e 90"';
      };

      recognition.onresult = (event) => {
        const transcricao = event.results[0][0].transcript;
        interpretarFala(transcricao);
      };

      recognition.onerror = (event) => {
        statusText.textContent = `Erro no microfone: ${event.error}`;
      };

      recognition.onend = () => {
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤 Falar Produto e Valor';
      };
    } else {
      btnMic.disabled = true;
      statusText.textContent = 'Seu navegador não suporta voz.';
    }

    // ==========================================
    // 📊 EXPORTAR CSV
    // ==========================================
    btnExportar.addEventListener('click', () => {
      if (!itensCache.length) {
        alert('A lista está vazia!');
        return;
      }

      const linhas = [['Quantidade', 'Produto', 'Valor Unitário (R$)', 'Subtotal (R$)', 'Status']];
      let totalGeral = 0;

      itensCache.forEach((item) => {
        const qtd = item.quantidade || 1;
        const unitario = item.valor || 0;
        const subtotal = qtd * unitario;
        totalGeral += subtotal;

        linhas.push([
          qtd,
          `"${item.nome.replace(/"/g, '""')}"`,
          unitario.toFixed(2).replace('.', ','),
          subtotal.toFixed(2).replace('.', ','),
          item.comprado ? 'Comprado' : 'Pendente'
        ]);
      });

      linhas.push(['', '', 'TOTAL GERAL', totalGeral.toFixed(2).replace('.', ','), '']);

      const csvConteudo = '\uFEFF' + linhas.map(linha => linha.join(';')).join('\r\n');
      const blob = new Blob([csvConteudo], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const dataHoje = new Date().toISOString().slice(0, 10);
      const link = document.createElement('a');
      link.href = url;
      link.download = `lista_mercado_${dataHoje}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
